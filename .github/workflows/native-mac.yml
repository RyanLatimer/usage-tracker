name: native-mac
on:
  push:
    branches: [main, master]
    paths: ["native/**", "usage_tracker.py", "pricing.json", ".github/workflows/native-mac.yml"]
    tags: ["native-v*", "v*"]
  pull_request:
    paths: ["native/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      TARGET: aarch64-apple-darwin
      ARCH: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build release binary
        working-directory: native
        run: cargo build --release --target $TARGET
      - name: Pack .app
        run: |
          VERSION="0.2.0"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#native-v}"
            VERSION="${VERSION#v}"
          fi
          ./native/pack-mac.sh \
            "native/target/$TARGET/release/agent-usage-rune" \
            dist \
            "Agent Usage" \
            "com.local.agent-usage-rune" \
            "$VERSION"
          cd dist && zip -r -y "AgentUsage-$ARCH.zip" "AgentUsage.app"
      - uses: actions/upload-artifact@v4
        with:
          name: AgentUsage-darwin-arm64
          path: dist/AgentUsage-darwin-arm64.zip
      - name: Test report aggregation
        run: |
          python3 native/test_daily.py
          cargo test --release --target "$TARGET" --manifest-path native/Cargo.toml
      - name: Render dashboard scenes
        run: |
          BIN="native/target/$TARGET/release/agent-usage-rune"
          mkdir -p screenshots
          "$BIN" --snap screenshots/overview-dark.png --scene demo --theme dark --size 1120x900
          "$BIN" --snap screenshots/overview-light.png --scene demo-light --theme light --size 1120x900
          "$BIN" --snap screenshots/empty.png --scene empty --theme dark --size 900x620
          "$BIN" --scene demo --theme dark --script native/scripts/filter.json --tree screenshots/filtered.json --snap screenshots/filtered.png --size 900x620
          python3 - <<'PYTEST'
          import json
          elements = {e['key']: e for e in json.load(open('screenshots/filtered.json'))['elements']}
          assert elements['title']['text'] == 'Claude Code'
          assert elements['models-count']['text'] == '1'
          assert elements['spend-value']['text'] == '$4.06'
          PYTEST
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: screenshots/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
