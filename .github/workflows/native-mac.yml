name: native-mac
on:
  push:
    branches: [main, master]
    paths: ["native/**", "usage_tracker.py", "pricing.json", ".github/workflows/native-mac.yml"]
    tags: ["native-v*", "v*"]
  pull_request:
    paths: ["native/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      TARGET: aarch64-apple-darwin
      ARCH: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build release binary
        working-directory: native
        run: cargo build --release --target $TARGET
      - name: Pack .app
        run: |
          VERSION="${GITHUB_REF_NAME#native-v}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] || [[ "$VERSION" == *"heads"* ]] && VERSION="0.1.0"
          ./native/pack-mac.sh \
            "native/target/$TARGET/release/agent-usage-rune" \
            dist \
            "Agent Usage" \
            "com.local.agent-usage-rune" \
            "$VERSION"
          cd dist && zip -r -y "AgentUsage-$ARCH.zip" "AgentUsage.app"
      - uses: actions/upload-artifact@v4
        with:
          name: AgentUsage-darwin-arm64
          path: dist/AgentUsage-darwin-arm64.zip
      - name: Smoke test (headless snap)
        run: |
          BIN="native/target/$TARGET/release/agent-usage-rune"
          "$BIN" --help 2>&1 | head -n 20 || true
          # headless render of the default + empty scenes (no GPU-required windowing on CI)
          "$BIN" --snap /tmp/agent-usage.png --scene default --theme dark --size 980x660 || true
          ls -la /tmp/agent-usage.png || true

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
